# Adds labels based on the issue form answers, so new apps only need a new
# option in the "App" dropdowns. Missing labels are created automatically.
name: Label issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const answer = heading => {
              const match = body.match(new RegExp(`### ${heading}\\s*\\n\\s*\\n([^\\n]+)`));
              const value = match ? match[1].trim() : '';
              return value && value !== '_No response_' ? value : null;
            };
            const slug = text => text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

            const labels = [];
            const app = answer('App');
            if (app) labels.push(`app:${slug(app)}`);
            if (answer('Forum link')) {
              labels.push('forum');
              const kind = answer('Type');
              if (kind === 'Bug') labels.push('bug');
              if (kind === 'Feature request') labels.push('enhancement');
              if (kind === 'Question') labels.push('question');
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels,
              });
            }
